# Posts every update of main to the team's Discord #github channel.
# Needs the repository secret DISCORD_WEBHOOK_URL (the channel's webhook).
name: Discord main updates

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PUSHER: ${{ github.event.pusher.name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.name }}
          TITLE: API updated
          COLOR: '3447003'
        run: |
          node --input-type=module -e '
            const env = process.env;
            if (!env.WEBHOOK) { console.log("DISCORD_WEBHOOK_URL is not set; skipping."); process.exit(0); }
            const gh = (path) => fetch("https://api.github.com/repos/" + env.REPO + path, {
              headers: { Authorization: "Bearer " + env.GH_TOKEN, Accept: "application/vnd.github+json" }
            }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
            const repoUrl = "https://github.com/" + env.REPO;
            const [pulls, compare] = await Promise.all([
              gh("/commits/" + env.AFTER + "/pulls"),
              /^0+$/.test(env.BEFORE) ? null : gh("/compare/" + env.BEFORE + "..." + env.AFTER)
            ]);
            const pr = Array.isArray(pulls) ? pulls.find((p) => p.merged_at) || pulls[0] : null;
            const subject = (env.HEAD_MESSAGE || "").split("\n")[0];
            const fromEditor = /shopify/i.test(env.HEAD_AUTHOR || "") || /shopify/i.test(env.PUSHER || "");
            let what, url, by;
            if (pr) {
              what = "[#" + pr.number + " " + pr.title + "](" + pr.html_url + ")";
              url = pr.html_url;
              by = pr.user.login;
            } else {
              what = (fromEditor ? "Changed in the Shopify theme editor: " : "") + subject;
              url = compare ? compare.html_url : repoUrl + "/commit/" + env.AFTER;
              by = env.HEAD_AUTHOR || env.PUSHER;
            }
            const files = (compare && compare.files) || [];
            const list = files.slice(0, 10).map((f) => "`" + f.filename + "`").join("\n")
              + (files.length > 10 ? "\n…and " + (files.length - 10) + " more" : "");
            const embed = {
              title: env.TITLE,
              url,
              description: what.slice(0, 3500),
              color: Number(env.COLOR),
              fields: [
                { name: "By", value: by || "unknown", inline: true },
                { name: "Commit", value: "[" + env.AFTER.slice(0, 7) + "](" + repoUrl + "/commit/" + env.AFTER + ")", inline: true }
              ],
              timestamp: new Date().toISOString()
            };
            if (list) embed.fields.push({ name: files.length + " file" + (files.length === 1 ? "" : "s") + " changed", value: list.slice(0, 1000) });
            const res = await fetch(env.WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ embeds: [embed], allowed_mentions: { parse: [] } })
            });
            if (!res.ok) { console.log("::error::Discord answered " + res.status); process.exit(1); }
            console.log("Posted: " + what);
          '
